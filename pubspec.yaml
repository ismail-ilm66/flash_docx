name: flash_dox
description: "Flash Dox - offline document scanner."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  fpdart: ^1.2.0
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.5
  # Round 11c, B1: the scanner camera (preview + full photo + a separate
  # 320 px analysis stream for the live outline).
  # Patched copy (packages/camerawesome/FLASHDOX_PATCH.md): photo size on
  # Android.
  camerawesome:
    path: packages/camerawesome
  image_picker: ^1.2.3
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  gal: ^2.3.3
  google_mlkit_text_recognition: ^0.16.0
  opencv_dart: ^2.2.2
  pdf: ^3.12.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_svg: ^2.3.0
  uuid: ^4.6.0
  equatable: ^3.0.0
  flutter_native_splash: ^2.4.7
  bloc_concurrency: ^0.3.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.2
  audioplayers: ^6.7.1
  sensors_plus: ^7.1.1
  google_mlkit_selfie_segmentation: ^0.11.0
  # Round 11b, P1-14: the face box for the passport photo's brightening
  # (bundled model, offline).
  google_mlkit_face_detection: 0.14.0
  printing: ^5.14.3

dev_dependencies:
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  injectable_generator: ^3.0.2
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^10.1.0
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  sqlite3: ^3.5.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/splash/
    - assets/sounds/
    - assets/smart_rules.json

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800

# P1-1: one splash. The 1152 px mark (treated as 4x = 288 dp) fits Android
# 12's round icon area; the Flutter splash's first frame draws the same
# image at the same size and centre (see SplashPage). Backgrounds are the
# light / dark theme `bg` tokens; the mark is transparent, so it suits both.
flutter_native_splash:
  color: "#F5F5F2"
  color_dark: "#0F1012"
  image: assets/splash/splash_mark_1152.png
  android_12:
    color: "#F5F5F2"
    color_dark: "#0F1012"
    image: assets/splash/splash_mark_1152.png
  ios: true
  android: true
  web: false

# App icon (round 11, option C: scan corners + page with a bolt):
# `dart run flutter_launcher_icons`. Sources in assets/icon/ (not bundled).
# Android 8+ gets the adaptive icon, Android 13+ the themed (monochrome)
# one; iOS the full 1024 tile.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/flashdox_icon_1024.png"
  adaptive_icon_background: "assets/icon/adaptive_background.png"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_monochrome.png"
  # The 1024 px layers already keep the mark inside the safe zone (corner
  # points within the round mask); no extra 16 % inset.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

dependency_overrides:
  # pdf 3.12 pins archive <4.1 while image >=4.11 secretly needs 4.1+.
  # Pin image to the last release that truly works with archive 4.0.x.
  image: 4.5.4

# Native OpenCV build: only the modules the app uses. `photo` is required for
# the non-local-means denoiser in the Auto / ID colour filters (excluded by
# default upstream); everything else stays out to keep the download small.
hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgproc
        - imgcodecs
        - photo
