name: flash_dox
description: "Flash Dox - offline document scanner."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  fpdart: ^1.2.0
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.5
  camera: ^0.12.0+2
  image_picker: ^1.2.3
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  gal: ^2.3.3
  google_mlkit_text_recognition: ^0.16.0
  google_mobile_ads: ^9.2.0
  opencv_dart: ^2.2.2
  pdf: ^3.12.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_svg: ^2.3.0
  uuid: ^4.6.0
  equatable: ^3.0.0
  connectivity_plus: ^7.3.2
  flutter_native_splash: ^2.4.7
  bloc_concurrency: ^0.3.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.2

dev_dependencies:
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  injectable_generator: ^3.0.2
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^10.1.0
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/splash/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800

flutter_native_splash:
  color: "#0F1012"
  image: assets/splash/splash_icon.png
  android_12:
    color: "#0F1012"
    image: assets/splash/splash_icon.png
  ios: true
  android: true
  web: false

dependency_overrides:
  # pdf 3.12 pins archive <4.1 while image >=4.11 secretly needs 4.1+.
  # Pin image to the last release that truly works with archive 4.0.x.
  image: 4.5.4
