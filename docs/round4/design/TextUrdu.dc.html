</div>
</div>

<div lang="ur" dir="rtl" style="font-family: 'Noto Nastaliq Urdu', serif; font-size: 17px; line-height: 2.2; color: {{c.muted}}">[اردو متن یہاں دکھایا جائے گا]</div>
</div>

<div style="position: absolute; inset: 0; background: {{c.scrim}}"></div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 20px; font-weight: 800">Add Urdu text recognition</div>
<div style="font-size: 14px; line-height: 1.5; color: {{c.muted}}">Download it once and read Urdu from your scans. After that it works without internet.</div>
</div>
<div style="display: flex; flex-direction: column; border: 1px solid {{c.border}}; border-radius: 14px">

</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<button style="height: 52px; border: 0; border-radius: 26px; background: {{c.accent}}; color: {{c.onAccent}}; font-family: inherit; font-size: 15px; font-weight: 800">Download Urdu</button>
<a href="Text.dc.html" style="height: 48px; border-radius: 24px; color: {{c.text}}; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Not now</a>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>

renderVals() {

}
}
</script>
