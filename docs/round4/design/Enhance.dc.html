<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enhance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1012; color: #F3F3F1; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 4px 8px">
<a href="Crop.dc.html" aria-label="Back to edges" style="width: 44px; height: 44px; color: #F3F3F1; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
<div style="font-size: 16px; font-weight: 700">Enhance</div>
<div style="font-size: 12px; color: #A6AAB2">Page 2 of 3</div>
</div>
<a href="Viewer.dc.html" style="height: 44px; padding: 0 12px; color: #FFC233; font-size: 15px; font-weight: 800; text-decoration: none; display: flex; align-items: center">Done</a>
</div>

<div style="flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #16181B">
<div style="width: 340px; height: 481px; background: #FFFFFF; border-radius: 3px; box-shadow: 0 8px 28px rgba(0,0,0,0.5); padding: 34px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 11px">
<div style="height: 11px; width: 52%; background: #1C1D20"></div>
<div style="height: 5px; background: #5D6068"></div><div style="height: 5px; background: #5D6068"></div><div style="height: 5px; width: 84%; background: #5D6068"></div>
<div style="height: 5px; background: #5D6068; margin-top: 12px"></div><div style="height: 5px; background: #5D6068"></div><div style="height: 5px; width: 68%; background: #5D6068"></div>
<div style="height: 5px; background: #5D6068; margin-top: 12px"></div><div style="height: 5px; width: 88%; background: #5D6068"></div><div style="height: 5px; background: #5D6068"></div><div style="height: 5px; width: 60%; background: #5D6068"></div>
<div style="height: 5px; background: #5D6068; margin-top: 12px"></div><div style="height: 5px; width: 78%; background: #5D6068"></div>
</div>
<div style="position: absolute; left: 12px; bottom: 12px; height: 40px; border-radius: 20px; background: rgba(0,0,0,0.65); display: flex; align-items: center">
<button aria-label="Zoom out" style="width: 40px; height: 40px; border: 0; background: transparent; color: #F3F3F1; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span style="font-size: 12px; font-weight: 800; min-width: 40px; text-align: center">100%</span>
<button aria-label="Zoom in" style="width: 40px; height: 40px; border: 0; background: transparent; color: #F3F3F1; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<button aria-label="Hold to compare with original" style="position: absolute; right: 12px; bottom: 12px; height: 40px; border: 0; border-radius: 20px; background: rgba(0,0,0,0.65); color: #F3F3F1; font-family: inherit; font-size: 12px; font-weight: 700; padding: 0 14px; display: flex; align-items: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M12 4v16"></path></svg>Hold to compare</button>
<div style="position: absolute; left: 0; right: 0; top: 10px; display: flex; justify-content: center; gap: 6px">
<span style="width: 6px; height: 6px; border-radius: 3px; background: #4A4E56"></span>
<span style="width: 18px; height: 6px; border-radius: 3px; background: #FFC233"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: #4A4E56"></span>
</div>
</div>

<div style="background: #1A1C20; padding: 12px 0 14px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 8px; padding: 0 12px; overflow: hidden">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
<button style="width: 56px; flex-shrink: 0; border: 0; background: transparent; color: {{f.labelColor}}; font-family: inherit; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 0">
<span style="width: 52px; height: 64px; border-radius: 9px; border: {{f.ring}}; box-sizing: border-box; padding: 3px; display: flex">
<span style="flex: 1; border-radius: 5px; background: {{f.paper}}; padding: 7px 6px; display: flex; flex-direction: column; gap: 4px">
<span style="height: 3px; width: 60%; background: {{f.ink}}"></span><span style="height: 2px; background: {{f.ink}}"></span><span style="height: 2px; background: {{f.ink}}"></span><span style="height: 2px; width: 75%; background: {{f.ink}}"></span>
</span></span>{{f.label}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 8px; padding: 0 12px">
<button style="height: 44px; border: 1px solid #3A3E46; border-radius: 22px; background: transparent; color: #F3F3F1; font-family: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Adjust</button>
<button style="height: 44px; border: 1px solid #3A3E46; border-radius: 22px; background: transparent; color: #F3F3F1; font-family: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>Reset</button>
<button aria-label="Apply to all pages: on" style="height: 44px; border: 0; border-radius: 22px; background: rgba(255,194,51,0.14); color: #F3F3F1; font-family: inherit; font-size: 13px; font-weight: 700; padding: 0 6px 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px">All 3 pages
<span style="width: 44px; height: 28px; border-radius: 14px; background: #FFC233; padding: 3px; box-sizing: border-box; display: flex; justify-content: flex-end"><span style="width: 22px; height: 22px; border-radius: 11px; background: #1B1400"></span></span></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const on = '2px solid #FFC233';
const off = '2px solid transparent';
const filters = [
{ label: 'Original', paper: '#E9E3D8', ink: '#8E9196', ring: off, labelColor: '#A6AAB2' },
{ label: 'Auto', paper: '#FFFFFF', ink: '#4A4D55', ring: on, labelColor: '#FFC233' },
{ label: 'ID colour', paper: '#E6F1EA', ink: '#2F4A3A', ring: off, labelColor: '#A6AAB2' },
{ label: 'Color boost', paper: '#FFFDF6', ink: '#24406E', ring: off, labelColor: '#A6AAB2' },
{ label: 'Grayscale', paper: '#F2F2F2', ink: '#6B6B6B', ring: off, labelColor: '#A6AAB2' },
{ label: 'B&W print', paper: '#FFFFFF', ink: '#000000', ring: off, labelColor: '#A6AAB2' }
];
return { filters };
}
}
</script>
</body>
</html>
