<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My signature</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; color: {{c.text}}; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 8px">
<a href="Settings.dc.html" aria-label="Back" style="width: 44px; height: 44px; color: {{c.text}}; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="font-size: 16px; font-weight: 700">My signature</div>
<div style="width: 44px"></div>
</div>

<div style="padding: 4px 20px 0 20px; display: flex; flex-direction: column; gap: 16px; flex: 1">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: {{c.surface2}}; border-radius: 14px; padding: 4px; gap: 4px">
<button style="height: 42px; border: 0; border-radius: 10px; background: {{c.surface}}; color: {{c.text}}; font-family: inherit; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13.5" r="3.5"></circle></svg>Scan from paper</button>
<button style="height: 42px; border: 0; border-radius: 10px; background: transparent; color: {{c.muted}}; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Draw</button>
</div>

<div style="height: 230px; border-radius: 18px; border: 1px solid {{c.border}}; background: repeating-conic-gradient(#ECECE7 0% 25%, #F7F7F3 0% 50%) 0 0 / 18px 18px; display: flex; align-items: center; justify-content: center; position: relative">
<svg width="300" height="130" viewBox="0 0 300 130" role="img" aria-label="Signature preview"><path d="M14 92c18-6 22-58 40-58 14 0 6 62 22 62 12 0 14-46 28-46 10 0 6 30 18 30 10 0 16-38 30-38 12 0 6 34 20 34 16 0 22-50 40-50 10 0 8 22 22 22 12 0 20-12 34-16" fill="none" stroke="{{ink}}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M40 112c60-6 150-8 230-4" fill="none" stroke="{{ink}}" stroke-width="2.6" stroke-linecap="round"></path></svg>
<div style="position: absolute; left: 12px; top: 12px; height: 26px; border-radius: 13px; background: rgba(15,16,18,0.75); color: #FFFFFF; font-size: 11px; font-weight: 700; padding: 0 10px; display: flex; align-items: center; gap: 6px">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Background removed</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 700; color: {{c.muted}}; letter-spacing: 0.5px">INK COLOUR</div>
<div style="display: flex; gap: 10px">
<button style="height: 44px; border: 1px solid {{c.border}}; border-radius: 22px; background: transparent; color: {{c.text}}; font-family: inherit; font-size: 14px; font-weight: 600; padding: 0 16px 0 10px; display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; border-radius: 11px; background: #15171A; border: 2px solid #FFFFFF; box-sizing: border-box"></span>Black</button>
<button style="height: 44px; border: 2px solid {{c.accent}}; border-radius: 22px; background: {{c.accentSoft}}; color: {{c.text}}; font-family: inherit; font-size: 14px; font-weight: 800; padding: 0 16px 0 10px; display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; border-radius: 11px; background: #1F3FAE; border: 2px solid #FFFFFF; box-sizing: border-box"></span>Blue</button>
<button style="height: 44px; border: 1px solid {{c.border}}; border-radius: 22px; background: transparent; color: {{c.text}}; font-family: inherit; font-size: 14px; font-weight: 600; padding: 0 16px 0 10px; display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; border-radius: 11px; background: #6B7078; border: 2px solid #FFFFFF; box-sizing: border-box"></span>Original</button>
</div>
</div>

<div style="display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; background: {{c.surface}}; border: 1px solid {{c.border}}; padding: 12px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.accentText}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
<div style="font-size: 12px; line-height: 1.5; color: {{c.muted}}">Sign on white paper with a dark pen, then take a photo. Your signature is saved only on this phone.</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 14px 20px 20px 20px">
<button style="height: 52px; border: 1px solid {{c.border}}; border-radius: 26px; background: transparent; color: {{c.text}}; font-family: inherit; font-size: 15px; font-weight: 700">Retake</button>
<a href="SignaturePlace.dc.html" style="height: 52px; border-radius: 26px; background: {{c.accent}}; color: {{c.onAccent}}; text-decoration: none; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">Save signature</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = { bg: '#0F1012', surface: '#1A1C20', surface2: '#24272D', border: '#2E3239', text: '#F3F3F1', muted: '#A6AAB2', accent: '#FFC233', onAccent: '#1B1400', accentText: '#FFC233', accentSoft: 'rgba(255,194,51,0.14)' };
const light = { bg: '#F5F5F2', surface: '#FFFFFF', surface2: '#EAEAE5', border: '#D6D6D0', text: '#15171A', muted: '#5C6169', accent: '#FFC233', onAccent: '#1B1400', accentText: '#8A5A00', accentSoft: 'rgba(255,194,51,0.22)' };
return { c: (this.props.theme ?? 'dark') === 'light' ? light : dark, ink: '#1F3FAE' };
}
}
</script>
</body>
</html>
