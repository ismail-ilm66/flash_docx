<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unlock with video</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.stage}}; color: {{c.text}}; font-family: Manrope, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center">
<div style="position: absolute; inset: 0; background: {{c.scrim}}"></div>
<div style="position: relative; width: 326px; background: {{c.surface}}; border-radius: 28px; padding: 28px 24px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<div style="width: 64px; height: 64px; border-radius: 32px; background: {{c.accent}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l12 7-12 7z"></path></svg></div>
<div style="font-size: 20px; font-weight: 800; line-height: 1.25">Unlock High quality</div>
<div style="font-size: 14px; line-height: 1.5; color: {{c.muted}}">Watch a short video to export this file at full resolution. Scanning, editing and standard sharing always stay free.</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: {{c.muted}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.6a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0"></path><circle cx="12" cy="20" r="1" fill="currentColor"></circle></svg>Needs internet for the video</div>
<div style="display: flex; flex-direction: column; gap: 6px; width: 100%; padding-top: 6px">
<button style="height: 52px; border: 0; border-radius: 26px; background: {{c.accent}}; color: {{c.onAccent}}; font-family: inherit; font-size: 15px; font-weight: 800">Watch video</button>
<a href="Export.dc.html" style="height: 48px; border-radius: 24px; color: {{c.text}}; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Not now</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = { stage: '#1A1C20', scrim: 'rgba(0,0,0,0.62)', surface: '#24272D', text: '#F3F3F1', muted: '#B3B7BE', accent: '#FFC233', onAccent: '#1B1400' };
const light = { stage: '#E8E8E3', scrim: 'rgba(15,16,18,0.45)', surface: '#FFFFFF', text: '#15171A', muted: '#5C6169', accent: '#FFC233', onAccent: '#1B1400' };
const c = (this.props.theme ?? 'dark') === 'light' ? light : dark;
return { c };
}
}
</script>
</body>
</html>
