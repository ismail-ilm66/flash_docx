<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign a document</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; color: {{c.text}}; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 8px">
<a href="Viewer.dc.html" aria-label="Cancel signing" style="width: 44px; height: 44px; color: {{c.text}}; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-size: 16px; font-weight: 700">Sign document</div>
<div style="font-size: 12px; color: {{c.muted}}">Page 3 of 3</div>
</div>
<a href="Viewer.dc.html" style="height: 44px; padding: 0 12px; color: {{c.accentText}}; font-size: 15px; font-weight: 800; text-decoration: none; display: flex; align-items: center">Done</a>
</div>

<div style="flex: 1; background: {{c.stage}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; position: relative">
<div style="width: 290px; height: 410px; background: #FFFFFF; border-radius: 4px; box-shadow: 0 6px 24px rgba(0,0,0,0.25); padding: 28px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 9px; position: relative">
<div style="height: 9px; width: 50%; background: #1C1D20"></div>
<div style="height: 4px; background: #6B6F77"></div><div style="height: 4px; background: #6B6F77"></div><div style="height: 4px; width: 86%; background: #6B6F77"></div>
<div style="height: 4px; background: #6B6F77; margin-top: 10px"></div><div style="height: 4px; background: #6B6F77"></div><div style="height: 4px; width: 70%; background: #6B6F77"></div>
<div style="height: 4px; background: #6B6F77; margin-top: 10px"></div><div style="height: 4px; width: 90%; background: #6B6F77"></div>
<div style="position: absolute; left: 24px; bottom: 54px; width: 110px; border-top: 1px solid #9FA3AA"></div>
<div style="position: absolute; left: 24px; bottom: 38px; font-size: 9px; color: #6B6F77">Signature</div>
<div style="position: absolute; left: 156px; bottom: 54px; width: 110px; border-top: 1px solid #9FA3AA"></div>
<div style="position: absolute; left: 156px; bottom: 38px; font-size: 9px; color: #6B6F77">Date</div>
<div style="position: absolute; left: 156px; bottom: 60px; font-size: 12px; font-weight: 600; color: #1F3FAE">05 Nov 2026</div>

<div style="position: absolute; left: 14px; bottom: 56px; width: 130px; height: 56px; border: 2px dashed #FFC233; border-radius: 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<svg width="118" height="46" viewBox="0 0 300 130" aria-hidden="true"><path d="M14 92c18-6 22-58 40-58 14 0 6 62 22 62 12 0 14-46 28-46 10 0 6 30 18 30 10 0 16-38 30-38 12 0 6 34 20 34 16 0 22-50 40-50 10 0 8 22 22 22 12 0 20-12 34-16" fill="none" stroke="#1F3FAE" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path><path d="M40 112c60-6 150-8 230-4" fill="none" stroke="#1F3FAE" stroke-width="5" stroke-linecap="round"></path></svg>
<button aria-label="Remove signature" style="position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 12px; border: 2px solid #FFFFFF; background: #15171A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<span aria-hidden="true" style="position: absolute; right: -9px; bottom: -9px; width: 18px; height: 18px; border-radius: 9px; background: #FFC233; border: 2px solid #FFFFFF; box-sizing: border-box"></span>
</div>
</div>
<div style="height: 30px; border-radius: 15px; padding: 0 12px; background: {{c.chip}}; color: {{c.text}}; font-size: 12px; font-weight: 600; display: flex; align-items: center">Drag to move · drag the corner to resize</div>
</div>

<div style="padding: 14px 16px 18px 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid {{c.border}}">
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 12px; font-weight: 700; color: {{c.muted}}; letter-spacing: 0.5px">INK</span>
<button aria-label="Black ink" style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid {{c.border}}; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><span style="width: 22px; height: 22px; border-radius: 11px; background: #15171A; border: 2px solid #FFFFFF; box-sizing: border-box"></span></button>
<button aria-label="Blue ink, selected" style="width: 36px; height: 36px; border-radius: 18px; border: 2px solid {{c.accent}}; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><span style="width: 22px; height: 22px; border-radius: 11px; background: #1F3FAE; border: 2px solid #FFFFFF; box-sizing: border-box"></span></button>
<div style="flex: 1"></div>
<a href="SignatureCreate.dc.html" style="height: 36px; display: flex; align-items: center; color: {{c.accentText}}; font-size: 13px; font-weight: 700; text-decoration: none; padding: 0 4px">Change signature</a>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 50px; border: 1px solid {{c.border}}; border-radius: 25px; background: transparent; color: {{c.text}}; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Add date</button>
<button style="height: 50px; border: 0; border-radius: 25px; background: {{c.accent}}; color: {{c.onAccent}}; font-family: inherit; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16c2.5-.5 3.5-6 6-6 1.8 0 1 5 3 5 1.6 0 2-3 3.6-3 1.3 0 1.4 2 5.4 2"></path><path d="M3 21h18"></path></svg>Add signature</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = { bg: '#0F1012', stage: '#1A1C20', chip: '#2E3239', border: '#2E3239', text: '#F3F3F1', muted: '#A6AAB2', accent: '#FFC233', onAccent: '#1B1400', accentText: '#FFC233' };
const light = { bg: '#F5F5F2', stage: '#E8E8E3', chip: '#FFFFFF', border: '#D6D6D0', text: '#15171A', muted: '#5C6169', accent: '#FFC233', onAccent: '#1B1400', accentText: '#8A5A00' };
return { c: (this.props.theme ?? 'dark') === 'light' ? light : dark };
}
}
</script>
</body>
</html>
