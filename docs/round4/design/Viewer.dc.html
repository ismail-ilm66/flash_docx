<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Document viewer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; color: {{c.text}}; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; gap: 4px; padding: 12px 8px">
<a href="Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; color: {{c.text}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<button aria-label="Rename document" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: {{c.text}}; font-family: inherit; display: flex; align-items: center; gap: 8px; padding: 0 4px; text-align: left">
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Flash Scan - 05 Nov 2026</span>
<span style="font-size: 12px; font-weight: 500; color: {{c.muted}}">3 pages · Today, 10:42</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
</button>
<button aria-label="More options" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
</div>

<div style="flex: 1; background: {{c.stage}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; position: relative">
<div style="position: absolute; left: 12px; right: 12px; top: 12px; background: {{c.banner}}; border: 1px solid {{c.border}}; border-radius: 14px; padding: 8px 4px 8px 12px; display: flex; align-items: center; gap: 10px; z-index: 1; box-shadow: 0 4px 14px rgba(0,0,0,0.18)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.accentText}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<div style="font-size: 13px; font-weight: 800">Looks like an electricity bill</div>
<div style="font-size: 12px; color: {{c.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Rename to “Electricity bill – Oct 2026” · Bills</div>
</div>
<button style="height: 36px; border: 0; border-radius: 18px; background: {{c.accent}}; color: {{c.onAccent}}; font-family: inherit; font-size: 13px; font-weight: 800; padding: 0 14px; flex-shrink: 0">Apply</button>
<button aria-label="Dismiss suggestion" style="width: 36px; height: 36px; border: 0; background: transparent; color: {{c.muted}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="width: 280px; height: 396px; background: #FFFFFF; border-radius: 4px; border: 1px solid {{c.border}}; box-shadow: 0 6px 24px rgba(0,0,0,0.25); padding: 30px 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="height: 10px; width: 52%; background: #1C1D20"></div>
<div style="height: 4px; background: #5D6068"></div><div style="height: 4px; background: #5D6068"></div><div style="height: 4px; width: 84%; background: #5D6068"></div>
<div style="height: 4px; background: #5D6068; margin-top: 12px"></div><div style="height: 4px; background: #5D6068"></div><div style="height: 4px; width: 68%; background: #5D6068"></div>
<div style="height: 4px; background: #5D6068; margin-top: 12px"></div><div style="height: 4px; width: 88%; background: #5D6068"></div><div style="height: 4px; background: #5D6068"></div>
</div>
<div style="height: 26px; border-radius: 13px; padding: 0 12px; background: {{c.chip}}; color: {{c.text}}; font-size: 12px; font-weight: 700; display: flex; align-items: center">2 / 3</div>
</div>

<div style="background: {{c.bg}}; padding: 12px 16px 6px 16px; display: flex; gap: 10px; align-items: center">
<sc-for list="{{pages}}" as="p" hint-placeholder-count="3">
<button aria-label="Page {{p.n}}" style="width: 52px; height: 68px; border-radius: 8px; border: {{p.ring}}; background: transparent; padding: 3px; box-sizing: border-box; position: relative; display: flex">
<span style="flex: 1; border-radius: 4px; background: #FFFFFF; border: 1px solid {{c.border}}; padding: 7px 6px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box">
<span style="height: 3px; width: 60%; background: #5D6068"></span><span style="height: 2px; background: #B9BCC2"></span><span style="height: 2px; background: #B9BCC2"></span><span style="height: 2px; width: 70%; background: #B9BCC2"></span>
</span>
<span style="position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); min-width: 18px; height: 18px; border-radius: 9px; background: {{p.badgeBg}}; color: {{p.badgeText}}; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.n}}</span>
</button>
</sc-for>
<a href="Camera.dc.html" aria-label="Add pages" style="width: 52px; height: 68px; border-radius: 8px; border: 2px dashed {{c.border}}; color: {{c.muted}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
<div style="flex: 1; font-size: 11px; color: {{c.muted}}; text-align: right">Hold to reorder</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 1.4fr; gap: 6px; align-items: center; padding: 14px 16px 18px 16px; border-top: 1px solid {{c.border}}; margin-top: 10px">
<a href="Enhance.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: {{c.text}}; text-decoration: none; font-size: 12px; font-weight: 600; padding: 4px 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Edit</a>
<a href="Text.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: {{c.text}}; text-decoration: none; font-size: 12px; font-weight: 600; padding: 4px 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7V5h16v2M9 19h6M12 5v14"></path></svg>Text</a>
<a href="SignaturePlace.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: {{c.text}}; text-decoration: none; font-size: 12px; font-weight: 600; padding: 4px 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16c2.5-.5 3.5-6 6-6 1.8 0 1 5 3 5 1.6 0 2-3 3.6-3 1.3 0 1.4 2 5.4 2"></path><path d="M3 21h18"></path></svg>Sign</a>
<a href="Export.dc.html" style="height: 48px; border-radius: 24px; background: {{c.accent}}; color: {{c.onAccent}}; text-decoration: none; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>Share</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = { bg: '#0F1012', stage: '#1A1C20', chip: '#2E3239', border: '#2E3239', text: '#F3F3F1', muted: '#A6AAB2', accent: '#FFC233', onAccent: '#1B1400', accentText: '#FFC233', banner: '#24272D' };
const light = { bg: '#F5F5F2', stage: '#E8E8E3', chip: '#FFFFFF', border: '#D6D6D0', text: '#15171A', muted: '#5C6169', accent: '#FFC233', onAccent: '#1B1400', accentText: '#8A5A00', banner: '#FFFFFF' };
const c = (this.props.theme ?? 'dark') === 'light' ? light : dark;
const pages = [1, 2, 3].map((n) => ({
n,
ring: n === 2 ? '2px solid #FFC233' : '2px solid transparent',
badgeBg: n === 2 ? '#FFC233' : c.chip,
badgeText: n === 2 ? '#1B1400' : c.text
}));
return { c, pages };
}
}
</script>
</body>
</html>
