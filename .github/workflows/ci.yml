name: CI

# Manual only: run from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --force-jit
      - run: flutter gen-l10n
      - run: flutter analyze
      # Goldens were recorded on macOS; skip them on Linux runners.
      - run: flutter test --exclude-tags golden
  android:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --force-jit
      - run: flutter build apk --debug -t lib/main_dev.dart
